<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASHA & AMOL | Wedding Invitation</title>
    <script>
      (() => {
        const targetFile = 'asha_amol_wedding_invitation (8) (1).html';
        const currentPath = window.location.pathname.split('/').pop() || '';

        if (!currentPath || /index\.html?/i.test(currentPath) || currentPath === '') {
          const redirectUrl = new URL('./' + encodeURI(targetFile), window.location.href).href;
          const startFadeOut = () => {
            const shell = document.querySelector('.page-shell');
            if (shell) {
              shell.classList.add('is-exiting');
            }
            window.setTimeout(() => {
              if (window.location.href !== redirectUrl) {
                window.location.replace(redirectUrl);
              }
            }, 850);
          };

          window.addEventListener('load', startFadeOut, { once: true });
        }
      })();
    </script>
    <style>
      :root {
        --bg: #fcfaf6;
        --ink: #4a3e3d;
        --gold: #c5a059;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fcfaf6 0%, #faf0f0 100%);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      .page-shell {
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 100vh;
        opacity: 1;
        transition: opacity 0.8s ease, transform 0.8s ease;
      }

      .page-shell.is-exiting {
        opacity: 0;
        transform: scale(0.985);
      }

      .card {
        text-align: center;
        padding: 2rem 2.5rem;
        border: 1px solid rgba(197, 160, 89, 0.35);
        border-radius: 24px;
        background: rgba(255,255,255,0.5);
        box-shadow: 0 20px 45px rgba(140, 109, 49, 0.12);
        backdrop-filter: blur(6px);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6b1f2d;
      }

      p {
        margin: 0 0 1rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.8rem;
      }

      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.85rem 1.4rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #d4b473 0%, #e8dcb8 50%, #c5a059 100%);
        color: #6b1f2d;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      a:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 26px rgba(197, 160, 89, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <h1>Asha &amp; Amol</h1>
        <p>Loading wedding invitation...</p>
        <a href="./asha_amol_wedding_invitation%20%288%29%20%281%29.html">Open invitation</a>
      </div>
    </div>
  </body>
</html>
